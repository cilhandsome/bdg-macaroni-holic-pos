<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="Macaroni Holic POS — offline-first web/PWA untuk kasir dan manajemen outlet." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Macaroni Holic POS</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Development safety: prevent an old service worker from serving stale localhost bundles.
      if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            registrations.forEach(function (registration) { registration.unregister(); });
          });
        }
        if ("caches" in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (key) { caches.delete(key); });
          });
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
